name: versions

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: changed packages have new versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-versions -- origin/${{ github.event.pull_request.base.ref }}
